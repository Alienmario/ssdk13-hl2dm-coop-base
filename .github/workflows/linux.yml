name: Linux

on: 
  push:
    paths:
      - '.github/workflows/linux.yml'
      - 'src/**'
  pull_request:
   paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on:
      ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src

      - name: Configure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y podman

      - name: Build project
        run: ./src/build_server_linux32

      - name: Upload package
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coopbase-linux32
          compression-level: 9
          path: |
            game/mod_coopbase/bin/
            !**/*.dbg
