name: Linux

on: 
  push:
    paths:
      - '.github/**'
      - 'src/**'
  pull_request:
   paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on:
      ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src

      - name: Configure dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gcc-multilib g++-multilib

      - name: Create project
        working-directory: src
        run: devtools/bin/vpc +dedicated /sdk2013ce /linux32 /define:SOURCESDK /mksln dedicated32

      - name: Build project
        working-directory: src
        run: make -f dedicated32.mak

      - name: Upload package
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coopbase-linux32
          compression-level: 9
          path: |
            game/mod_coopbase/bin/
            !**/*.dbg
