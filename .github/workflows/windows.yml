name: Windows

on: 
  push:
    paths:
      - '.github/workflows/windows.yml'
      - 'src/**'
  pull_request:
   paths:
      - 'src/**'
  workflow_dispatch:

jobs:
  build:
    runs-on:
      windows-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            src

      - name: Configure dependencies
        uses: ilammy/msvc-dev-cmd@v1
        
      - name: Build
        run: ./src/build_server_win32.bat Release noretry
        shell: powershell
      
      - name: Upload package
        uses: actions/upload-artifact@v4.4.3
        with:
          name: coopbase-win32
          compression-level: 9
          path: |
            game/mod_coopbase/bin/
